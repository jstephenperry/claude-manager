name: Release

# Builds the Windows artifacts and attaches them to a GitHub Release.
# Trigger by pushing a version tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# `workflow_dispatch` allows a manual run for testing the build without
# publishing a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate application icon
        run: npm run icon

      # The same sandboxed suites CI runs, so a tag cannot publish a build
      # that skipped a check the branch had to pass.
      - name: Trash, restore, purge and path-guard suite
        run: node scripts/t-trash.mjs

      - name: Link containment and delete-time liveness suite
        run: node scripts/t-guard.mjs

      - name: Memory diagnosis and MEMORY.md repair suite
        run: node scripts/t-memfix.mjs

      - name: Scan timing and scoped-refresh correctness
        run: node scripts/t-bench.mjs

      - name: Build Windows artifacts
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/SHA256SUMS.txt
          body: |
            What changed in this version: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            ## Downloads

            | File | Use |
            | --- | --- |
            | `Claude Manager-*-Setup.exe` | Installer — Start Menu and desktop shortcuts, uninstaller |
            | `Claude Manager-*-portable.exe` | Single executable, no install |
            | `Claude Manager-*-x64.zip` | Unpacked build |

            > These builds are **not code-signed**. Windows SmartScreen will show
            > "Windows protected your PC" on first run — choose **More info** →
            > **Run anyway**.

            `SHA256SUMS.txt` lists the checksum of every artifact, produced by
            the same workflow run that built them. Verify a download with
            `sha256sum -c SHA256SUMS.txt` (or `Get-FileHash` on Windows).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
