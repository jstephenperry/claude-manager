name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax-check every source file
        shell: bash
        run: |
          fail=0
          for f in $(find src scripts -name '*.js' -o -name '*.cjs' -o -name '*.mjs'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

      # The trash suite runs entirely inside a temporary CLAUDE_CONFIG_DIR, so
      # it is safe on a runner with no Claude Code data of its own.
      - name: Trash, restore, purge and path-guard suite
        run: node scripts/t-trash.mjs

      # Sandboxed: directory links planted inside a managed root, and a session
      # that starts after the last scan, driven through the IPC handlers.
      - name: Link containment and delete-time liveness suite
        run: node scripts/t-guard.mjs

      # Also sandboxed: it builds its own memory directory and repairs it there.
      - name: Memory diagnosis and MEMORY.md repair suite
        run: node scripts/t-memfix.mjs

      # The timing half finds no data on a runner and says so; the correctness
      # half builds its own sandbox and checks scoped refresh against full scan.
      - name: Scan timing and scoped-refresh correctness
        run: node scripts/t-bench.mjs

      - name: Icon generation
        run: npm run icon
