<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
    <title>Claude Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Claude Manager</h1>
          <p class="root-path" id="root-path">—</p>
        </div>
      </div>

      <nav class="tabs" id="tabs" role="tablist"></nav>

      <div class="topbar-right">
        <div class="stat-strip" id="stat-strip"></div>
        <button class="btn btn-ghost" id="refresh" title="Rescan ~/.claude">
          <span class="spin-target">⟳</span> Rescan
        </button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div id="overlay" class="overlay" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
